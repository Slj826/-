<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>序章｜寓幽劇情檔案</title>
  <link rel="stylesheet" href="A劇情.css">
</head>
<body>
  
  <audio id="bgm" loop><source src="序章.mp3" type="audio/mpeg"></audio>
  <audio id="typeSound" preload="auto"><source src="click.mp3" type="audio/mpeg"></audio>
  <div id="storyPlayer">
    <div id="fadeOut"></div>
    <div id="storyBg"></div>
    <div id="charLayer">
      <img id="charLeft" class="character left" src="" alt="">
      <img id="charRight" class="character right" src="" alt="">
    </div>
    <div class="dialog-box">
      <div id="speaker"></div>
      <div id="dialogText"></div>
      <div class="tip">點擊繼續</div>
    </div>
  </div>
  <script src="A劇情播放器.js"></script>
  <script src="A序章.js"></script>
  <script src="script.js"></script>
</body>
</html>
